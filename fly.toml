app = "erp-system"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "erp_data"
  destination = "/app/server/databases"

[[mounts]]
  source = "erp_uploads"
  destination = "/app/server/uploads"

[env]
  NODE_ENV = "production"
