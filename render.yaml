services:
- type: web
  name: erp-system
  runtime: docker
  autoDeployTrigger: commit
  plan: free
  region: ohio
  envVars:
  - key: DATABASE_URL
    fromDatabase:
      name: erp-db
      property: connectionString

databases:
- name: erp-db
  plan: free
  region: ohio
  databaseName: erp
  user: erp_user
